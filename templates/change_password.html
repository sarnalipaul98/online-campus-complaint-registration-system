<!DOCTYPE html>
<html>
<head>
    <title>Change Password</title>
    <style>
        body { 
            display:flex; 
            justify-content:center; 
            align-items:center; 
            height:100vh; 
            background:#f0f0f0; 
            font-family:Arial; 
            background: url("{{ url_for('static', filename='BG.jpg') }}") no-repeat center center/cover;
        }
        .box { 
            background:white; 
            padding:30px; 
            border-radius:10px; 
            width:320px; 
            box-shadow:0 5px 15px rgba(0,0,0,0.3); 
        }
        input, button { width:100%; padding:10px; margin:8px 0; }
        button { background:#007BFF; color:white; border:none; cursor:pointer; }
        a { display:block; text-align:center; margin-top:10px; text-decoration:none; }

        .flash-success { color: green; font-weight: bold; }
        .flash-error { color: red; font-weight: bold; }
    </style>
</head>
<body>
<div class="box">
    <h3>Change Password</h3>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                {% if category == 'success' %}
                    <p class="flash-success">{{ message }}</p>
                {% else %}
                    <p class="flash-error">{{ message }}</p>
                {% endif %}
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="/change_password">
        <input type="hidden" name="next" value="{{ next_page }}">
        <input type="password" name="old_password" placeholder="Old Password" required>
        <input type="password" name="new_password" placeholder="New Password" required>
        <button type="submit">Update Password</button>
    </form>

    <a href="/{{ next_page if next_page else 
    ('student_home' if session.get('role')=='student' 
    else 'manager_dashboard' if session.get('role')=='manager' 
    else 'admin_dashboard') }}">
    ← Back
</a>
        
</div>

<script>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                {% if category == 'success' %}
                    setTimeout(function() {
                        window.location.href = "/{{ next_page if next_page else 
                        ('student_home' if session.get('role')=='student' 
                        else 'manager_dashboard' if session.get('role')=='manager' 
                        else 'admin_dashboard') }}";
                    }, 2000); // 2 seconds
                {% endif %}
            {% endfor %}
        {% endif %}
    {% endwith %}
</script>

</body>
</html>
