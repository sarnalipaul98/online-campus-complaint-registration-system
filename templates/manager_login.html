<!DOCTYPE html>
<html lang="en">
<head>
    <title>Complaint Officer Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: url("{{ url_for('static', filename='campus.jpg') }}") no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .login-box {
            width: 100%;
            max-width: 380px;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }

        .btn-action {
            background:#f0ad4e;
            color:white;
            border:none;
            width:100%;
            padding:10px;
            margin-top:10px;
            border-radius:5px;
            text-decoration:none;
            display:inline-block;
            cursor:pointer;
        }

        .btn-action:hover {
            background:#ec971f;
        }

        .alert-success { color: green; font-weight: bold; }
        .alert-danger { color: red; font-weight: bold; }
    </style>
</head>

<body>

<div class="login-box">
    <h3 class="mb-4">Complaint Officer Login</h3>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ 'success' if category=='success' else 'danger' }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="post">
        <div class="mb-3">
            <input type="text" name="username" class="form-control" placeholder="Officer Username" required>
        </div>

        <div class="mb-3">
            <input type="password" name="password" class="form-control" placeholder="Password" required>
        </div>

        <button class="btn btn-success w-100">Login</button>
    </form>

    <div class="login-links mt-3">
        <a class="btn-action"
           href="{{ url_for('forgot_password', role='manager') }}">
           Forgot Password?
        </a>
    </div>

    <div class="text-center mt-3">
        <a href="/" class="text-decoration-none">← Back to Home</a>
    </div>
</div>

</body>
</html>
