<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Dashboard - Styled Form</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
<style>

body{
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f0f2f5;
    margin: 0;
    padding: 20px;
}

/* Top-right bar */
.top-bar {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-bottom: 20px;
}
.student-id {
    background: green;
    color: white;
    padding: 8px 15px;
    border-radius: 8px;
    font-weight: bold;
}
.logout-btn {
    background: #e74c3c;
    color: white;
    padding: 8px 15px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
}

/* Form container like dashboard box */
form.complaint-form {
    background-image: url("{{ url_for('static', filename='BG.jpg') }}"); /* your BG.jpg in static folder */
    background-size: cover;        /* make it cover the form */
    background-position: center;   /* center the image */
    background-repeat: no-repeat;
    color: black;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    gap: 15px;
}

/* Row of cards inside form */
.form-row {
    display: flex;
    gap: 15px;
}

/* Each field card */
.form-card {
    flex: 1;
    background: rgba(255,255,255,0.95);
    padding: 12px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

/* Inputs inside card */
.form-card input,
.form-card select,
.form-card textarea,
.form-card input[type="file"] {
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 14px;
}

/* Textarea bigger */
.form-card textarea {
    height: 80px;
    resize: vertical;
}

/* Submit button */
button.submit-btn {
    background: #ffcc00;
    color: #000;
    font-weight: bold;
    padding: 12px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    width: 50%;
    align-self: center;
    margin-top: 10px;
    transition: background 0.3s, transform 0.2s;
}
button.submit-btn:hover {
    background: #e6b800;
    transform: scale(1.05);
}
</style>
</head>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
<body>

<div class="top-bar-box" style="position:relative; height:60px; margin-bottom:20px;
    display:flex; align-items:center;">

    <!-- Left: Back to Home as blue box -->
    <a href="{{ url_for('student_home') }}" 
       style="background:#3498db; color:white; font-weight:bold; padding:8px 15px; 
              border-radius:8px; text-decoration:none;">
        ← Back to Home
    </a>

    <!-- Center: Raise A Complaint heading -->
    <h2 style="position:absolute; left:50%; top:50%; transform:translate(-50%, -50%);
               margin:0; color:black; font-weight:bold;">Raise A Complaint</h2>

    <!-- Right side: Student ID + Logout -->
    <div style="margin-left:auto; display:flex; gap:10px; align-items:center;">
        <span class="student-id">👤 {{ student_id }}</span>
        <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
    </div>

</div></div>

<!-- FLASH MESSAGES (place this here) -->
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="alert alert-{{ 'success' if category=='success' else 'danger' }} alert-dismissible fade show" role="alert" style="margin-bottom:20px;">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}
  {% endif %}
{% endwith %}
<form method="post" enctype="multipart/form-data" class="complaint-form">

<!-- Row 0: Student ID (non-editable) -->
<div class="form-row" >
    <div class="form-card" style="flex: 0 0 50%;">
        <label>Student ID</label>
        <input type="text" name="sid" value="{{ student_id }}" readonly>
    </div>
    </div>

    <!-- Row 1: First Name | Last Name -->
    <div class="form-row">
        <div class="form-card">
            <label>First Name</label>
            <input type="text" name="first_name" placeholder="first name" required>
        </div>
        <div class="form-card">
            <label>Last Name</label>
            <input type="text" name="last_name" placeholder="last name"  required>
        </div>
    </div>

    <!-- Row 2: Contact No | Year | Student Type -->
<div class="form-row">
    <div class="form-card">
        <label>Contact No</label>
        <input type="text" name="phone"  placeholder="mobile.no" pattern="\d{10}" title="Enter exactly 10 digits" required>
    </div>
    <div class="form-card">
        <label>Year</label>
        <select name="year" required>
            <option value="">Select Year</option>
            <option>1st Year</option>
            <option>2nd Year</option>
            <option>3rd Year</option>
            <option>4th Year</option>
        </select>
    </div>
    <div class="form-card">
        <label>Student Type</label>
        <select name="student_type" required>
            <option value="">Select Type</option>
            <option>Hosteller</option>
            <option>Day Scholar</option>
        </select>
    </div>
</div>
    
<!-- Row 3: Department -->
<div class="form-row">
    <div class="form-card">
        <label>Department</label>
        <select name="department" required>
            

<option value="">-- Select Department --</option>
            <option>Computer Science / Information Technology</option>
            <option>Mechanical Engineering</option>
            <option>Civil Engineering</option>
            <option>Electrical & Electronics Engineering</option>
            <option>Electronics & Communication Engineering</option>
            <option>Management Studies (BBA / MBA)</option>
            <option>Commerce (B.Com / M.Com)</option>
            <option>Science Department</option>
            <option>Arts & Humanities</option>
            <option>Law Department</option>

        </select>
    </div>
<div class="form-card">
            <label>Category</label>
            <select name="category" required>
                <option>Water Leakage</option>
                <option>Furniture</option>
                <option>Ragging</option>
                <option>Broken Items</option>
                <option>Transport</option>
                <option>Security</option>
                <option>Electricity</option>
                <option>WI-FI</option>
                <option>Sanitation / Hygiene</option>
                <option>Food Quality</option>
                <option>Academic Issue</option>
                <option>Event/Cultural Issue</option>
                <option>Others</option>
            </select>
        </div>

</div>
    
    <!-- Row 5: Description -->
    <div class="form-row">
        <div class="form-card">
            <label>Description</label>
            <textarea name="description" placeholder="Describe your complaint" required></textarea>
        </div>
    </div>

    <!-- Row 6: File Upload -->
    <div class="form-row">
        <div class="form-card">
            <label>Attach File</label>
            <input type="file" name="file">
        </div>
    </div>

    <button type="submit" class="submit-btn">Submit Complaint</button>

</form>

</body>
</html>
