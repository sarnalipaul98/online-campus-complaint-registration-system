<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: url("{{ url_for('static', filename='campus.jpg') }}") no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .login-box {
            width: 100%;
            max-width: 380px;
            background: rgba(255,255,255,0.95);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }

        .login-links a {
            display: block;
            color: #007BFF;
            text-decoration: none;
            margin: 5px 0;
        }

        .login-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h3 class="text-center mb-4">Student Login</h3>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <div class="alert alert-{{ 'success' if category=='success' else 'danger' }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% endwith %}

    <form method="post">
        <div class="mb-3">
            <input type="text" name="username" class="form-control" placeholder="Student ID" required>
        </div>
        <div class="mb-3">
            <input type="password" name="password" class="form-control" placeholder="Password" required>
        </div>
        <button class="btn btn-primary w-100">Login</button>
    </form>

    <div class="login-links mt-2">
        <a href="{{ url_for('forgot_password', user=request.form.username if request.method=='POST' else '', role='student') }}">
            Forgot Password?
        </a>
        <a href="/">← Back to Home</a>
    </div>
</div>

</body>
</html>
